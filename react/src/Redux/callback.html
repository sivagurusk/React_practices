<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function greet(name){
            console.log("Hello "+name);
        }
        function give(callback){
            callback("Guru");
        }
        give(greet); 

        greets=(age)=>{
            console.log("my age is "+ age);
        }
        gives=(call)=>{
            call('21');
        }
        gives(greets);
    </script>
</body>
</html>
